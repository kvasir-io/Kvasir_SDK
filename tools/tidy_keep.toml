# Keep table of tools/tidy.py: sources and headers the runner never tidies or reports, each with its reason.
# Keys are "<repo>/<path glob>" (`*` within a path part, `**` across parts, `{a,b}`); <repo> is the name of the
# checkout that owns the file (the innermost directory holding a .git). A key whose first part is a repository name is
# STALE (exit 1) when that repository is scanned and nothing in it matches any more: remove the entry in the change
# that removed the file. Reasons are neutral: this file is part of a library. Paths the config's
# ExcludeHeaderFilterRegex already cuts (generated headers, _deps, Kvasir_SDK/lib, brigand) are not repeated here.

# Not ours: neither tidied as a main file nor reported from a header.
[skip]
"pioasm/**" = "Raspberry Pi's PIO assembler (upstream code with a generated lexer), built as a host tool"
"mcufont/**" = "a fork of the third-party mcufont decoder and encoder; its style is upstream's"
"gfx/src/gfx/fonts/**" = "font tables written by mcufont's encoder: generated data"
"net/src/net/drivers/Cyw43/firmware/**" = "the radio's firmware and NVRAM images as generated byte tables"

# Translation units that must not compile (each test proves a compile-time refusal): never tidied as a main file.
[must_fail]
"**/*must_fail*" = "must-fail snippets: a compile error is their pass condition"
"**/*_fail.cpp" = "must-fail test sources: a compile error is their pass condition"
"**/compile_fail_*.cpp" = "must-fail test sources: a compile error is their pass condition"
"chip_rp_common/tests/bad/*.cpp" = "must-fail PIO programs and PWM configs: a compile error with the expected message is their pass condition"
