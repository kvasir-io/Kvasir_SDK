name: CI

on:
    schedule:
        # Run on the 1st of every month at 02:00 UTC (container refresh)
        - cron: '0 2 1 * *'
    push:
        branches:
            - master
    pull_request:
        branches:
            - master
    # the images are containers.yml (it runs after a green CI on master, or by its own dispatch); the LLVM port's drift
    # check is llvm-port.yml
    workflow_dispatch:

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        container:
            image: archlinux:latest
        # the tool groups this job installs (tests/tooling/armtc.py): a tool test that would skip for one of them fails
        env:
            KVASIR_TEST_REQUIRE: ${{ matrix.compiler.cc == 'clang' && 'arm-gcc,clang,llvm,host-cxx' || 'arm-gcc,host-cxx' }}
        strategy:
            fail-fast: false
            matrix:
                compiler:
                    - {cc: gcc, cxx: g++}
                    - {cc: gcc, cxx: g++, stdlib_debug: true, sanitizer: address}
                    - {cc: gcc, cxx: g++, sanitizer: undefined}
                    - {cc: clang, cxx: clang++}
                    - {cc: clang, cxx: clang++, stdlib: libc++, stdlib_debug: true, sanitizer: address}
                    - {cc: clang, cxx: clang++, stdlib: libc++, sanitizer: undefined}
                    # the threaded tests' memory ordering (and every other test) under TSan: the justfile's tsan config
                    - {cc: clang, cxx: clang++, stdlib: libc++, sanitizer: thread}

        steps:
            - name: Set up C++ environment
              run: |
                pacman -Syu --noconfirm
                # arm-none-eabi-gcc/newlib: the ARM toolchain tests; KVASIR_TEST_REQUIRE makes a skip of an installed group a failure
                pacman -S --noconfirm git cmake base-devel python arm-none-eabi-gcc arm-none-eabi-newlib ${{ matrix.compiler.cc == 'clang' && 'clang llvm lld' || '' }} ${{ matrix.compiler.stdlib == 'libc++' && 'libc++ lld' || '' }}

            - name: Checkout repository
              uses: actions/checkout@v6
              with:
                submodules: recursive

            - name: Configure CMake
              run: >
                cmake -S tests -B build
                ${{ matrix.compiler.sanitizer && format('-DKVASIR_TEST_SANITIZER={0}', matrix.compiler.sanitizer) || '' }}
                ${{ matrix.compiler.stdlib && format('-DKVASIR_TEST_STD_LIB={0}', matrix.compiler.stdlib) || '' }}
                ${{ matrix.compiler.stdlib_debug && '-DKVASIR_TEST_STDLIB_DEBUG=true' || '' }}
              env:
                CC: ${{ matrix.compiler.cc }}
                CXX: ${{ matrix.compiler.cxx }}

            - name: Build tests
              run: cmake --build build -j"$(nproc)"

            # the sanitizer jobs leave out the tool tests: none of them runs code of this tree's sanitizer (they compile
            # for ARM or run Python), so the plain gcc and clang jobs cover them
            - name: Run tests
              run: cd build && ctest --output-on-failure ${{ matrix.compiler.sanitizer && '-LE tool' || '' }}

            # clang-tidy (tools/tidy.py with .clang-tidy of this checkout) over this tree: the tests, the self-contained
            # headers on the volatile path, uc_log and svd_converter as the tests compile them; the nested checkouts
            # count as this repository. A pull request tidies the units its change reaches.
            - name: clang-tidy
              if: matrix.compiler.cc == 'clang' && !matrix.compiler.sanitizer
              uses: ./.github/actions/tidy
              timeout-minutes: 45
              with:
                trees: build
                sdk: .
                nested: 'true'
                mode: ${{ github.event_name == 'pull_request' && 'changed' || 'full' }}

    # The SDK's headers in ARM context: the host tree above never sees the Arm-only branches, and a chip's or core's
    # own CI counts SDK findings as foreign. The conformance trees of an M0+ and an M33 core (their paired chips and
    # kvasir_devices from master), configured against THIS checkout and tidied with --repo . (findings in this
    # repository and its nested checkouts fail; the core's and chip's are foreign).
    tidy-arm:
        name: tidy-arm ${{ matrix.core }}
        runs-on: ubuntu-latest
        container:
            image: archlinux:latest
        strategy:
            fail-fast: false
            matrix:
                core: [core_cortex_m0plus, core_cortex_m33]

        steps:
            - name: Set up the toolchain
              run: |
                pacman -Syu --noconfirm --disable-download-timeout
                pacman -S --noconfirm --disable-download-timeout git cmake ninja base-devel python clang llvm lld

            - name: Checkout repository
              uses: actions/checkout@v6
              with:
                submodules: recursive

            - name: Configure git safe directory
              run: git config --global --add safe.directory '*'

            # a run step, not a second actions/checkout: act's containers have no node for it
            - name: Clone the core
              run: git clone --quiet --depth 1 --recurse-submodules --shallow-submodules
                https://github.com/kvasir-io/${{ matrix.core }}.git "$RUNNER_TEMP/${{ matrix.core }}"

            - name: Configure and build the conformance tree
              run: |
                cmake -S "$RUNNER_TEMP/${{ matrix.core }}/tests/conformance" -B build/conformance -G Ninja \
                    -DCOMPILE_TARGET=arm_clang -DKVASIR_ROOT="$GITHUB_WORKSPACE"
                cmake --build build/conformance -j"$(nproc)"

            - name: clang-tidy
              uses: ./.github/actions/tidy
              timeout-minutes: 45
              with:
                trees: build/conformance
                sdk: .
                nested: 'true'
