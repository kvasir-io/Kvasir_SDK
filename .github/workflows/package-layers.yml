name: Package layers

# Reusable: the include layering of a library repository (a core, a chip, a common package, kvasir_devices) against
# this repository's layer table: tools/layer_check.py --repo <name>=<checkout>. Any NEW finding or STALE keep
# entry fails (there is no allow-list: fix the finding). The table and the tool come from SDK master, so a header
# move in the caller changes tools/layers.toml here first. The caller is scanned with its submodules (a chip's
# rp_common or atsam_common and core, the core's cortex_common) at the commits it records, each as its own
# repository: an include cycle or a detail name between the caller and a submodule fails here. A submodule's name is
# its URL's last part, a [repo.*] key of the table. A detail name the caller uses from any other repository is found
# by the workspace-wide check only.
# The fatal-path rules (tools/check_fatal_sites.py, from SDK master too) over the caller's own sources: every fatal path
# calls Panic::beginFatal() before its log line, only a path that ends calls it, a crit line only on a fatal path
# (Runtime/Check.hpp's error classes are the packages' too). src/ where the caller has one, else the whole checkout (a
# common package keeps its headers at the top). A finding fails.
# The compat check (tools/compat_check.py and its keep table tools/compat_keep.toml, from SDK master too) over the
# caller's checkout: the shapes the no-compat rule forbids (the tool's docstring lists them). A NEW finding or a STALE
# keep entry fails; a deliberate one gets a keep entry in the SDK's table first.
# Callers: the core, chip and kvasir_devices repositories' workflows, job `layers`.

on:
    workflow_call:
        inputs:
            repo-name:
                description: 'the [repo.<name>] key in tools/layers.toml; empty: the caller repository name'
                required: false
                type: string
                default: ''

jobs:
    layers:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6
              with:
                path: repo

            - name: Kvasir_SDK layer table and tool
              uses: actions/checkout@v6
              with:
                repository: kvasir-io/Kvasir_SDK
                path: kvasir_sdk
                sparse-checkout: |
                  tools/layer_check.py
                  tools/layers.toml
                  tools/check_fatal_sites.py
                  tools/compat_check.py
                  tools/compat_keep.toml
                sparse-checkout-cone-mode: false

            # the table key: repo-name, else the caller's name - from the event payload, else GITHUB_REPOSITORY (act
            # without an event file has no payload, and an empty name made every path a NEW finding)
            - name: Repository name
              id: name
              run: |
                name="${{ inputs.repo-name || github.event.repository.name }}"
                name="${name:-${GITHUB_REPOSITORY#*/}}"
                [ -n "$name" ] || { echo "no repository name: set the repo-name input" >&2; exit 1; }
                echo "name=$name" >> "$GITHUB_OUTPUT"

            # the caller with its submodules, for the layer check alone: a copy of repo/ with each submodule fetched
            # at the commit the copy records, into its own path (the tool resolves an include from the including
            # file's directory, so a submodule must sit where the build finds it), nested ones too. repo/ stays as it
            # is: the fatal-site and compat steps scan the caller's own files only.
            - name: Submodules
              id: subs
              run: |
                cp -a repo full
                args=()
                fetch_submodules() {
                  local top=$1 key path url name sha
                  [ -f "$top/.gitmodules" ] || return 0
                  while read -r key path; do
                    url=$(git -C "$top" config -f .gitmodules --get "${key%.path}.url")
                    name=$(basename "$url" .git)
                    sha=$(git -C "$top" ls-tree HEAD -- "$path" | awk '$2 == "commit" { print $3 }')
                    [ -n "$sha" ] || { echo "$top: no commit recorded for $path" >&2; exit 1; }
                    git init -q "$top/$path"
                    git -C "$top/$path" fetch -q --depth 1 "$url" "$sha"
                    git -C "$top/$path" checkout -q FETCH_HEAD
                    echo "$name: $top/$path at $sha"
                    args+=(--repo "$name=$top/$path")
                    fetch_submodules "$top/$path"
                  done < <(git -C "$top" config -f .gitmodules --get-regexp '^submodule\..*\.path$')
                }
                fetch_submodules full
                echo "args=${args[*]}" >> "$GITHUB_OUTPUT"

            - name: Layer check
              run: >
                python3 -B kvasir_sdk/tools/layer_check.py
                --repo "${{ steps.name.outputs.name }}=full"
                ${{ steps.subs.outputs.args }}

            # also after a layer finding: the two checks are independent
            - name: Fatal sites
              if: ${{ !cancelled() }}
              run: |
                dir=repo/src
                [ -d "$dir" ] || dir=repo
                n=$(find "$dir" -name '*.hpp' | wc -l)
                echo "fatal-site rules over $n headers in $dir"
                [ "$n" -gt 0 ] || { echo "no header to scan in $dir" >&2; exit 1; }
                python3 -B kvasir_sdk/tools/check_fatal_sites.py "$dir"

            # also after a finding above: independent of the two checks before it
            - name: Compat check
              if: ${{ !cancelled() && steps.name.outcome == 'success' }}
              run: >
                python3 -B kvasir_sdk/tools/compat_check.py --quiet
                --repo "${{ steps.name.outputs.name }}=repo"
